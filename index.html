<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A colorful, animated two-player Tic Tac Toe game.">
  <title>Tic Tac Toe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161344'/%3E%3Cpath d='M8 8l16 16M24 8L8 24' stroke='%2300d4ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='none' stroke='%23ff6bd5' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <div class="app">
    <div class="bg-aurora" aria-hidden="true"></div>
    <div class="bg-aurora" aria-hidden="true"></div>

    <header class="header">
      <h1 class="title">Tic&nbsp;Tac&nbsp;Toe</h1>
      <p class="subtitle">Local two-player arcade</p>
      <div class="scoreboard">
        <div class="score-card score-x">
          <span class="score-label">Player X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score-card score-draw">
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score-card score-o">
          <span class="score-label">Player O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="turn-indicator" id="turn-indicator">
        <span class="turn-dot" aria-hidden="true"></span>
        <span class="turn-text" id="turn-text">Your move, Player</span>
        <span class="turn-player player-x" id="turn-player">X</span>
      </div>

      <div class="board-container" id="board-container">
        <div class="board" id="board" aria-label="Tic tac toe board">
          <button type="button" class="cell" data-index="0" aria-label="Row 1, Column 1, empty"></button>
          <button type="button" class="cell" data-index="1" aria-label="Row 1, Column 2, empty"></button>
          <button type="button" class="cell" data-index="2" aria-label="Row 1, Column 3, empty"></button>
          <button type="button" class="cell" data-index="3" aria-label="Row 2, Column 1, empty"></button>
          <button type="button" class="cell" data-index="4" aria-label="Row 2, Column 2, empty"></button>
          <button type="button" class="cell" data-index="5" aria-label="Row 2, Column 3, empty"></button>
          <button type="button" class="cell" data-index="6" aria-label="Row 3, Column 1, empty"></button>
          <button type="button" class="cell" data-index="7" aria-label="Row 3, Column 2, empty"></button>
          <button type="button" class="cell" data-index="8" aria-label="Row 3, Column 3, empty"></button>
          <svg class="win-line" id="win-line" viewBox="0 0 100 100" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="message-area" id="message-area" role="status" aria-live="polite">
        <p class="game-message" id="game-message"></p>
      </div>

      <div class="controls">
        <button type="button" class="btn btn-restart" id="btn-restart">
          <span class="btn-text">New Game</span>
        </button>
        <button type="button" class="btn btn-reset-scores" id="btn-reset-scores">
          <span class="btn-text" id="btn-reset-scores-text">Reset Scores</span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <p>First to fill a row, column or diagonal wins</p>
    </footer>

    <div class="celebration-container" id="celebration-container" aria-hidden="true"></div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
