<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/board.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">Tic Tac Toe</h1>
      <div class="scoreboard">
        <div class="score-card score-x">
          <span class="score-label">Player X</span>
          <span class="score-value" id="score-x">0</span>
        </div>
        <div class="score-card score-draw">
          <span class="score-label">Draws</span>
          <span class="score-value" id="score-draw">0</span>
        </div>
        <div class="score-card score-o">
          <span class="score-label">Player O</span>
          <span class="score-value" id="score-o">0</span>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="turn-indicator" id="turn-indicator">
        <span class="turn-text">Current Turn:</span>
        <span class="turn-player" id="turn-player">X</span>
      </div>

      <div class="board-container" id="board-container">
        <div class="board" id="board">
          <div class="cell" data-index="0" tabindex="0"></div>
          <div class="cell" data-index="1" tabindex="0"></div>
          <div class="cell" data-index="2" tabindex="0"></div>
          <div class="cell" data-index="3" tabindex="0"></div>
          <div class="cell" data-index="4" tabindex="0"></div>
          <div class="cell" data-index="5" tabindex="0"></div>
          <div class="cell" data-index="6" tabindex="0"></div>
          <div class="cell" data-index="7" tabindex="0"></div>
          <div class="cell" data-index="8" tabindex="0"></div>
        </div>
      </div>

      <div class="message-area" id="message-area">
        <p class="game-message" id="game-message"></p>
      </div>

      <button class="btn btn-restart" id="btn-restart">
        <span class="btn-text">New Game</span>
      </button>
    </main>

    <div class="celebration-container" id="celebration-container"></div>
  </div>

  <script src="js/game.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
